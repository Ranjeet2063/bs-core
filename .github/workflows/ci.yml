name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  rust-tests:
    name: Rust Invariant Verification (46,000+ Days)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run Formal Verification Tests
        run: cargo test --release --verbose

  node-tests:
    name: TypeScript & Node.js Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Node Tests
        run: node --test --experimental-strip-types ts/test/index.test.ts
